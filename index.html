<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Личный кабинет партнёра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: system-ui; padding: 20px; }
        .balance { font-size: 24px; font-weight: bold; text-align: center; margin: 20px 0; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Ваш кабинет</h1>
    <div class="balance" id="balanceValue">💰 Загрузка...</div>
    <button id="viewLeadsBtn">📋 Мои лиды</button>
    <button id="withdrawBtn">💸 Вывести деньги</button>
    <button id="closeBtn">Закрыть</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что приложение готово
        tg.expand(); // Раскрываем приложение на весь экран
        
        // Получаем данные для авторизации пользователя
        const initData = tg.initData;
        console.log("Init data for backend:", initData);
        
        // Здесь будет логика для получения данных с вашего сервера (API)
        document.getElementById('viewLeadsBtn').onclick = () => {
            // Пока просто закрываем приложение, чтобы показать принцип
            tg.close();
        };
        
        document.getElementById('closeBtn').onclick = () => {
            tg.close();
        };
    </script>
</body>
</html>
